services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: workledger-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/var/www/html
      - ./packages:/var/www/packages
    depends_on:
      - db
    networks:
      - workledger

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: workledger-web
    restart: unless-stopped
    ports:
      - "5173:5174"
    stdin_open: true
    tty: true
    volumes:
      - ./apps/web:/app
    depends_on:
      - api
    networks:
      - workledger

  db:
    image: mysql:8.0
    container_name: workledger-db
    restart: unless-stopped
    ports:
      - "3308:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: workledger
      MYSQL_USER: workledger
      MYSQL_PASSWORD: secret
    volumes:
      - ./infra/db/data:/var/lib/mysql
    networks:
      - workledger

networks:
  workledger:
    driver: bridge
